<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Untitled</title>

  <body>
  <title>كيف نعبر الشارع بأمان؟</title>
<style>
  :root{--purple:#6c5ce7;--green:#4caf50;--red:#ff7675;--ink:#3a3a4a;--sub:#7c7c92;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fef6e4 0%,#e8f4fd 100%);
    font-family:"Tahoma","Segoe UI",Arial,sans-serif;direction:rtl;color:var(--ink);display:flex;justify-content:center;}
  .app{width:100%;max-width:500px;min-height:100vh;display:flex;flex-direction:column;padding:16px 16px 24px;position:relative;}
  .sound-toggle{position:fixed;top:12px;left:12px;width:40px;height:40px;border-radius:50%;border:none;background:#fff;
    box-shadow:0 4px 12px rgba(0,0,0,.15);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:50;transition:transform .15s ease;}
  .sound-toggle:active{transform:scale(0.9);}
  header{text-align:center;padding-top:8px;margin-bottom:10px;}
  header h1{font-size:20px;margin:0 0 4px;font-weight:800;color:var(--ink);}
  header p{font-size:13px;margin:0;color:var(--sub);}
  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}

  .level-list{display:flex;flex-direction:column;gap:14px;margin-top:8px;}
  .level-card{background:#fff;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:18px 16px;display:flex;align-items:center;
    gap:14px;cursor:pointer;border:5px solid transparent;transition:transform .15s ease,border-color .2s ease;}
  .level-card:active{transform:scale(0.98);}
  .level-card .icon{font-size:34px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#f4f1ff;border-radius:16px;flex-shrink:0;}
  .level-card .txt{flex:1;text-align:right;}
  .level-card .txt h3{margin:0 0 4px;font-size:16px;font-weight:800;}
  .level-card .txt p{margin:0;font-size:13px;color:var(--sub);}
  .level-card .dots-mini{display:flex;gap:4px;margin-top:8px;}
  .level-card .dots-mini span{width:7px;height:7px;border-radius:50%;background:#e6e6ee;}
  .level-card .dots-mini span.done{background:var(--green);}

  .game-top{display:flex;align-items:center;justify-content:flex-start;gap:14px;margin-bottom:10px;}
  .back-btn{border:none;background:#fff;border-radius:50%;width:36px;height:36px;box-shadow:0 3px 8px rgba(0,0,0,.1);font-size:16px;cursor:pointer;}
  .progress{display:flex;gap:8px;}
  .progress span{width:12px;height:12px;border-radius:50%;background:#e6e6ee;transition:transform .2s ease,background .2s ease;}
  .progress span.current{background:var(--purple);box-shadow:0 0 0 4px rgba(108,92,231,.25);}
  .progress span.done{background:var(--green);transform:scale(1.15);}

  .prompt-box{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.08);padding:14px;display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .prompt-box p{flex:1;margin:0;font-size:19px;font-weight:700;line-height:1.5;text-align:right;}
  .speak-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--purple);color:#fff;font-size:16px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s ease;}
  .speak-btn:active{transform:scale(0.92);}
  .speak-btn.speaking{animation:pulse .6s infinite alternate;}
  @keyframes pulse{from{box-shadow:0 0 0 0 rgba(108,92,231,.5);}to{box-shadow:0 0 0 10px rgba(108,92,231,0);}}

  .cards-wrap{display:flex;flex-direction:column;gap:12px;}
  .card{position:relative;background:#fff;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.12);border:5px solid transparent;
    overflow:hidden;cursor:pointer;transition:transform .15s ease,border-color .2s ease;}
  .card:active{transform:scale(0.98);}
  .card.locked{cursor:default;}
  .card img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;image-rendering:auto;pointer-events:none;-webkit-user-drag:none;}
  .card.correct{border-color:var(--green);}
  .card.wrong-flash{border-color:var(--red);animation:shake .4s ease;}
  @keyframes shake{0%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}100%{transform:translateX(0);}}
  .badge{position:absolute;top:8px;left:8px;width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;opacity:0;transform:scale(0.4);transition:opacity .3s ease,transform .3s ease;}
  .badge.show{opacity:1;transform:scale(1);}
  .xmark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .xmark.show{opacity:1;}
  .xmark span{font-size:64px;color:#ff4d4d;text-shadow:0 2px 6px rgba(0,0,0,.4);font-weight:900;}

  .game-area{transition:opacity .25s ease;}
  .game-area.fading{opacity:0;}

  /* المستوى الثاني (٣ صور): نفس حجم صور النشاط المرجعي */
  #gameArea.lvl-2 .prompt-box{padding:10px 14px;margin-bottom:10px;}
  #gameArea.lvl-2 .prompt-box p{font-size:17px;}
  #gameArea.lvl-2 .cards-wrap{gap:8px;}
  #gameArea.lvl-2 .card img{aspect-ratio:16/9;}

  .summary-card{background:#fff;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:28px 20px;text-align:center;margin-top:12px;}
  .summary-card h2{font-size:24px;margin:0 0 6px;}
  .summary-card .score{font-size:34px;font-weight:900;color:var(--purple);margin:10px 0;}
  .stars{font-size:30px;letter-spacing:4px;margin-bottom:14px;}
  .summary-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .summary-actions button{border:none;padding:11px 18px;border-radius:28px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s ease;}
  .summary-actions button:active{transform:scale(0.94);}
  .btn-primary{background:var(--purple);color:#fff;}
  .btn-secondary{background:#f0f0f6;color:var(--ink);}
</style>

<div class="app">
  <button class="sound-toggle" id="soundToggle" aria-label="صوت">🔊</button>
  <header>
    <h1>كيف نعبر الشارع بأمان؟</h1>
    <p>لعبة اختيار السلوك الصحيح</p>
  </header>

  <section class="screen active" id="screen-levels">
    <div class="level-list">
      <div class="level-card" data-level="1">
        <div class="icon">🚸</div>
        <div class="txt"><h3>المستوى الأول</h3><p>اختر بين صورتين</p><div class="dots-mini" id="miniDots1"></div></div>
      </div>
      <div class="level-card" data-level="2">
        <div class="icon">🎯</div>
        <div class="txt"><h3>المستوى الثاني</h3><p>اختر بين ثلاث صور</p><div class="dots-mini" id="miniDots2"></div></div>
      </div>
    </div>
  </section>

  <section class="screen" id="screen-game">
    <div class="game-top">
      <button class="back-btn" id="backBtn">➡</button>
      <div class="progress" id="progressDots"></div>
    </div>
    <div class="game-area" id="gameArea">
      <div class="prompt-box">
        <button class="speak-btn" id="speakBtn">🔊</button>
        <p>كَيْفَ نَعْبُرُ الشَّارِعَ بِأَمَانٍ؟</p>
      </div>
      <div class="cards-wrap" id="cardsWrap"></div>
    </div>
  </section>

  <section class="screen" id="screen-summary">
    <div class="summary-card">
      <h2>أحسنت! 🎉</h2>
      <div class="score" id="summaryScore"></div>
      <div class="stars" id="summaryStars"></div>
      <div class="summary-actions">
        <button class="btn-secondary" id="restartLevelBtn">إعادة المستوى</button>
        <button class="btn-primary" id="nextActionBtn">المستوى التالي</button>
      </div>
    </div>
  </section>
</div>

const LEVELS = {
  1: [ {src:IMGS.safe, ok:true}, {src:IMGS.alone, ok:false} ],
  2: [ {src:IMGS.safe, ok:true}, {src:IMGS.cars, ok:false}, {src:IMGS.phone, ok:false} ]
};
const ROUNDS = 5;              // خمس تكرارات في كل مستوى
const NEXT_DELAY = 1000;       // بعد انتهاء صوت "ممتاز" ثم الانتقال
const QUESTION_DELAY = 500;    // قبل تشغيل السؤال في كل تكرار
const WRONG_MARK_TIME = 2000;  // مدة بقاء ❌ على الصورة

const $ = id => document.getElementById(id);
const sounds = { q:$("audioQuestion"), ok:$("audioCorrect"), no:$("audioWrong") };
Object.values(sounds).forEach(a => a.volume = 1.0);
const speakBtn = $("speakBtn"), gameArea = $("gameArea"), cardsWrap = $("cardsWrap");
let soundOn = true, unlocked = false;
let level = 1, round = 0, score = 0, triedWrong = false, locked = false, lastKey = "", timers = [];
const doneRounds = {1:0, 2:0};

function later(fn, ms){ const t = setTimeout(fn, ms); timers.push(t); return t; }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

function unlockAudio(){
  if (unlocked) return; unlocked = true;
  Object.values(sounds).forEach(a => {
    a.muted = true;
    const p = a.play();
    const reset = () => { a.pause(); a.currentTime = 0; a.muted = false; };
    if (p && p.then) p.then(reset).catch(() => { a.muted = false; }); else reset();
  });
}
function stopAll(){
  Object.values(sounds).forEach(a => { a.onended = null; a.pause(); try{ a.currentTime = 0; }catch(e){} });
  speakBtn.classList.remove("speaking");
}
// صوت واحد فقط في كل مرة حتى لا تتداخل الأصوات
function play(name, done){
  stopAll();
  const a = sounds[name];
  let finished = false, guard = null;
  const finish = () => { if (finished) return; finished = true; clearTimeout(guard);
    speakBtn.classList.remove("speaking"); if (done) done(); };
  if (!soundOn){ guard = setTimeout(finish, 600); return; }
  const dur = (a.duration && isFinite(a.duration)) ? a.duration * 1000 : 5000;
  guard = setTimeout(finish, dur + 800);
  a.onended = finish;
  a.muted = false; a.volume = 1.0; a.currentTime = 0;
  if (name === "q") speakBtn.classList.add("speaking");
  const p = a.play(); if (p && p.catch) p.catch(finish);
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0,0);
}
function renderMiniDots(){
  [1,2].forEach(l => {
    $("miniDots"+l).innerHTML = Array.from({length:ROUNDS}, (_,i) => `<span class="${i < doneRounds[l] ? "done" : ""}"></span>`).join("");
  });
}
function renderProgress(){
  $("progressDots").innerHTML = Array.from({length:ROUNDS}, (_,i) =>
    `<span class="${i < round ? "done" : i === round ? "current" : ""}"></span>`).join("");
}
function shuffled(arr){
  let a, key, n = 0;
  do {
    a = arr.slice();
    for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
    key = a.map(x => x.ok ? 1 : 0).join("") + a.map(x => x.src.length).join("");
    n++;
  } while (key === lastKey && n < 10);
  lastKey = key; return a;
}

function renderRound(){
  locked = false; triedWrong = false;
  renderProgress();
  cardsWrap.innerHTML = "";
  shuffled(LEVELS[level]).forEach(item => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<img src="${item.src}" alt=""><div class="xmark"><span>❌</span></div><div class="badge">✓</div>`;
    card.addEventListener("click", () => choose(card, item.ok));
    cardsWrap.appendChild(card);
  });
  gameArea.classList.remove("fading");
  window.scrollTo(0,0);
  later(() => play("q"), QUESTION_DELAY);
}

function choose(card, ok){
  if (locked || card.dataset.wrong === "1") return;
  if (ok){
    locked = true; clearTimers();
    cardsWrap.querySelectorAll(".card").forEach(c => {
      c.classList.add("locked"); c.classList.remove("wrong-flash");
      c.querySelector(".xmark").classList.remove("show");
    });
    card.classList.add("correct");
    card.querySelector(".badge").classList.add("show");
    if (!triedWrong) score++;
    play("ok", () => later(nextRound, NEXT_DELAY));
  } else {
    triedWrong = true;
    card.dataset.wrong = "1";
    card.querySelector(".xmark").classList.add("show");
    card.classList.remove("wrong-flash"); void card.offsetWidth; card.classList.add("wrong-flash");
    play("no");
    later(() => {
      if (locked) return;
      card.querySelector(".xmark").classList.remove("show");
      card.classList.remove("wrong-flash");
      card.dataset.wrong = "";
    }, WRONG_MARK_TIME);
  }
}

function nextRound(){
  round++;
  doneRounds[level] = Math.max(doneRounds[level], round);
  if (round >= ROUNDS) return showSummary();
  gameArea.classList.add("fading");
  later(renderRound, 250);
}

function showSummary(){
  stopAll(); clearTimers();
  const stars = score >= 5 ? 3 : score >= 3 ? 2 : 1;
  $("summaryScore").textContent = score + " / " + ROUNDS;
  $("summaryStars").textContent = "⭐".repeat(stars);
  $("nextActionBtn").textContent = level === 1 ? "المستوى التالي" : "المستويات";
  renderMiniDots();
  showScreen("screen-summary");
}

function startLevel(l){
  unlockAudio(); stopAll(); clearTimers();
  level = l; round = 0; score = 0; lastKey = "";
  gameArea.classList.toggle("lvl-2", l === 2);
  showScreen("screen-game");
  renderRound();
}
function goLevels(){ stopAll(); clearTimers(); renderMiniDots(); showScreen("screen-levels"); }

document.querySelectorAll(".level-card").forEach(c => c.addEventListener("click", () => startLevel(+c.dataset.level)));
$("backBtn").addEventListener("click", goLevels);
$("restartLevelBtn").addEventListener("click", () => startLevel(level));
$("nextActionBtn").addEventListener("click", () => level === 1 ? startLevel(2) : goLevels());
speakBtn.addEventListener("click", () => { unlockAudio(); if (!locked) play("q"); });
$("soundToggle").addEventListener("click", () => {
  soundOn = !soundOn; $("soundToggle").textContent = soundOn ? "🔊" : "🔇";
  if (!soundOn) stopAll();
});
renderMiniDots();
</script>
